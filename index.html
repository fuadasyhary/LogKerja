<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk &bull; LogKerja Pro</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236366f1'/><text x='50%' y='53%' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-weight='900' font-size='42' fill='%23ffffff'>LOG</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#f8fafc] text-slate-800 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <!-- Global Loader -->
    <div id="global-loader" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-[100] flex flex-col items-center justify-center hidden">
        <div class="bg-white p-6 rounded-3xl shadow-2xl flex flex-col items-center space-y-4 max-w-xs w-full mx-4 border border-slate-100 animate-pulse">
            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <div class="text-center">
                <h4 id="loader-text" class="font-bold text-sm text-slate-800">Memproses Data...</h4>
                <p class="text-[11px] text-slate-400 mt-0.5">Mohon tunggu sebentar</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK Imports -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-analytics.js";

        window.firebaseModules = {
            initializeApp, getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signInAnonymously, onAuthStateChanged,
            getFirestore, getAnalytics
        };
    </script>

    <!-- Auth Card -->
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-100">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-600 p-8 text-white text-center">
            <div class="w-16 h-16 bg-white/10 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner">
                <i class="fa-solid fa-briefcase text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">LogKerja Pro</h1>
            <p class="text-blue-100 text-xs mt-1">Kelola Log Harian & Capai Target KPI Profesionalmu</p>
        </div>
        
        <div class="p-6">
            <div class="flex bg-slate-100 p-1 rounded-2xl mb-6">
                <button id="tab-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-[11px] font-bold rounded-xl bg-white text-blue-600 shadow-sm transition-all">Masuk</button>
                <button id="tab-register" onclick="switchAuthTab('register')" class="flex-1 py-2 text-[11px] font-bold rounded-xl text-slate-500 hover:text-slate-800 transition-all">Daftar</button>
                <button id="tab-guest" onclick="switchAuthTab('guest')" class="flex-1 py-2 text-[11px] font-bold rounded-xl text-slate-500 hover:text-slate-800 transition-all">Tamu</button>
            </div>

            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div id="email-field-wrapper">
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Email</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-envelope text-xs"></i></span>
                        <input type="email" id="auth-email" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white" placeholder="nama@perusahaan.com">
                    </div>
                </div>
                <div id="password-wrapper">
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-lock text-xs"></i></span>
                        <input type="password" id="auth-password" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white" placeholder="••••••••">
                    </div>
                </div>

                <div id="guest-wrapper" class="space-y-2 hidden">
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1.5">ID User / UID</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-400"><i class="fa-solid fa-user-shield text-xs"></i></span>
                        <input type="text" id="guest-uid-input" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white" placeholder="Masukkan User UID...">
                    </div>
                </div>

                <div id="auth-error" class="text-rose-500 text-xs font-medium hidden"></div>

                <button type="submit" id="auth-submit-btn" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-2xl shadow-lg shadow-blue-200 transition-all text-xs">
                    Masuk ke Akun
                </button>
                <div class="py-3 px-6 bg-slate-50 border-t border-slate-100 text-center mt-4">
                    <p class="text-[11px] text-slate-400">&copy; 2026 LogKerja &bull; <span class="font-bold text-slate-600">@Mochamad Fuad Asyhary</span></p>
                </div>
            </form>
        </div>
    </div>

    <script>
        let auth, currentAuthMode = 'login';

        window.addEventListener('DOMContentLoaded', () => { setTimeout(initAuthApp, 300); });

        function showLoader(text="Memproses...") { document.getElementById('loader-text').textContent = text; document.getElementById('global-loader').classList.remove('hidden'); }
        function hideLoader() { document.getElementById('global-loader').classList.add('hidden'); }

        function initAuthApp() {
            const firebaseConfig = {
                apiKey: "AIzaSyDdHNw_tN_keSlNePxCib8M98dsxo00_Gg",
                authDomain: "log-kerja.firebaseapp.com",
                projectId: "log-kerja",
                storageBucket: "log-kerja.firebasestorage.app",
                messagingSenderId: "567064697097",
                appId: "1:567064697097:web:9fab04051f05eaf8d45bd8",
                measurementId: "G-7236830RH2"
            };
            const fm = window.firebaseModules;
            const app = fm.initializeApp(firebaseConfig);
            auth = fm.getAuth(app);

            showLoader("Memeriksa Sesi...");
            fm.onAuthStateChanged(auth, (user) => {
                hideLoader();
                if (user) {
                    // Jika sudah login, arahkan ke dashboard
                    window.location.href = 'dashboard/index.html';
                }
            });
        }

        function switchAuthTab(mode) {
            currentAuthMode = mode;
            document.getElementById('tab-login').className = "flex-1 py-2 text-[11px] font-bold rounded-xl " + (mode==='login'?'bg-white text-blue-600 shadow-sm':'text-slate-500');
            document.getElementById('tab-register').className = "flex-1 py-2 text-[11px] font-bold rounded-xl " + (mode==='register'?'bg-white text-blue-600 shadow-sm':'text-slate-500');
            document.getElementById('tab-guest').className = "flex-1 py-2 text-[11px] font-bold rounded-xl " + (mode==='guest'?'bg-white text-blue-600 shadow-sm':'text-slate-500');

            document.getElementById('email-field-wrapper').style.display = mode === 'guest' ? 'none' : 'block';
            document.getElementById('password-wrapper').style.display = mode === 'guest' ? 'none' : 'block';
            document.getElementById('guest-wrapper').style.display = mode === 'guest' ? 'block' : 'none';
            document.getElementById('auth-submit-btn').textContent = mode === 'login' ? 'Masuk ke Akun' : mode === 'register' ? 'Daftar Akun Baru' : 'Masuk sebagai Tamu';
        }

        async function handleAuthSubmit(e) {
            e.preventDefault();
            const errEl = document.getElementById('auth-error');
            errEl.classList.add('hidden');
            const fm = window.firebaseModules;

            if (currentAuthMode === 'guest') {
                const uid = document.getElementById('guest-uid-input').value.trim();
                if (!uid) { errEl.textContent = "Masukkan UID terlebih dahulu."; errEl.classList.remove('hidden'); return; }
                showLoader("Masuk sebagai Tamu...");
                await fm.signInAnonymously(auth);
                window.location.href = 'dashboard/index.html';
                return;
            }

            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;

            showLoader(currentAuthMode === 'login' ? "Masuk..." : "Mendaftarkan...");
            try {
                if (currentAuthMode === 'login') {
                    await fm.signInWithEmailAndPassword(auth, email, password);
                } else {
                    await fm.createUserWithEmailAndPassword(auth, email, password);
                }
                window.location.href = 'dashboard/index.html';
            } catch (err) {
                hideLoader();
                errEl.textContent = err.message;
                errEl.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
